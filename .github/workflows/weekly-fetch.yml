name: Weekly Timetable Update

on:
  schedule:
    # Runs at 12:00 AM (GMT+8) every Monday
    # Note: GitHub Actions uses UTC time, so 16:00 UTC = 00:00 GMT+8
    - cron: '0 16 * * 0'
  workflow_dispatch:
    # Allows manual triggering of the workflow

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run data fetching script
        run: node weeklyFetch.js
        
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output.json
          git commit -m "Weekly timetable data update [automated]" || echo "No changes to commit"
          git push